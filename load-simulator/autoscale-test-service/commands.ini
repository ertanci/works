Prometheus Erişimi: http://localhost:9090/query


# Uygulama Dağıtımı
TAG=$(date +%Y%m%d-%H%M)
echo $TAG
docker build -t test-app:$TAG .
k3d image import test-app:$TAG -c thesis-cluster
kubectl apply -f deployment.yaml
kubectl apply -f service.yaml
kubectl apply -f servicemonitor.yaml

# experiment script'ini arka planda çalıştırma
nohup bash -c 'bash scripts/run_experiment.sh && sleep 60 && bash scripts/run_spike_experiment.sh' > results/full_experiment_$(date +%Y%m%d_%H%M%S).log 2>&1 &

# K6 sonuçlarını analiz etme
python3 analyze_k6_summary.py ../results/k6/spike-load/20260506_011556_HPA_Spike_Set1_50_to_400_summary.json

# Prometheus'tan metrikleri çekme - yöntem2: belirli zaman aralığına göre
python3 scripts/export_metrics.py \
  --prom-url http://localhost:9090 \
  --timeline results/metrics/experiment_timeline.csv \
  --output results/metrics/metrics_all.csv \
  --start "2026-05-05 23:05:00" \
  --end "2026-05-06 01:40:00" \
  --timezone Europe/Istanbul \
  --step 5


# tüm senaryoları içeren veri seti oluşturma
# sadece set senaryolarını içeren veri seti oluşturma
python3 scripts/preprocess_split.py \
  --input results/metrics/metrics_all.csv \
  --scenario all \
  --autoscalers HPA,KEDA \
  --include-idle \
  --idle-target-pods 1 \
  --idle-rps-threshold 0.5 \
  --idle-in-progress-threshold 0.5 \
  --max-idle-ratio 0.25 \
  --clean-output results/metrics/ml_dataset_all_clean.csv \
  --train-output results/metrics/ml_train_all.csv \
  --test-output results/metrics/ml_test_all.csv \
  --split-method set \
  --test-set-nos 5 \
  --latency-slo-threshold 0.5 \
  --error-rate-slo-threshold 0.05

# Gerekli Kütüphanelerin Kurulumu
sudo apt install python3-joblib
sudo apt install python3-sklearn

# Model eğitimi ve değerlendirmesi
python3 scripts/train_model.py \
  --train results/metrics/ml_train_all.csv \
  --test results/metrics/ml_test_all.csv \
  --target-column required_pods \
  --model-output models/best_model.joblib \
  --results-output results/metrics/model_results.csv \
  --predictions-output results/metrics/model_predictions.csv \
  --group-results-output results/metrics/model_group_results.csv \
  --max-pods 60

# Model Tahminleri
python3 scripts/predict_pods.py \
  --model models/best_model.joblib \
  --rps 120 \
  --p95-latency 0.65 \
  --error-rate 0.02 \
  --cpu-mcores 1800 \
  --in-progress-requests 45 \
  --min-pods 1 \
  --max-pods 60 \
  --rounding ceil

# Canlı Tahminler
python3 scripts/predict_live.py \
  --model models/best_model.joblib \
  --prom-url http://127.0.0.1:19090 \
  --namespace default \
  --deployment autoscale-test-service \
  --container ats \
  --endpoint-label exported_endpoint \
  --interval 5 \
  --scale-up-cooldown-seconds 15 \
  --scale-down-cooldown-seconds 60 \
  --min-change 1 \
  --min-pods 1 \
  --max-pods 60 \
  --latency-slo-threshold 0.5 \
  --error-rate-slo-threshold 0.05 \
  --apply-scale \
  --no-hpa-like-policy \
  --output-csv results/metrics/ml_autoscaler_live.csv

# modeli canlı olarak test etmek için:
SETS=1 bash scripts/ml_run_experiment.sh

  # farklı yük seviyeleri kontrol edilecek.
