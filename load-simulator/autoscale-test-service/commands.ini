# Uygulama Dağıtımı
TAG=$(date +%Y%m%d-%H%M)
echo $TAG
docker build -t test-app:$TAG .
k3d image import test-app:$TAG -c thesis-cluster
kubectl apply -f deployment.yaml
kubectl apply -f service.yaml
kubectl apply -f servicemonitor.yaml

# 1) HPA
kubectl apply -f hpa.yaml
k6 run common-load-test.js
kubectl delete hpa autoscale-test-service-hpa

# 2) KEDA
kubectl apply -f keda-slo.yaml
k6 run common-load-test.js
kubectl delete scaledobject autoscale-test-service-keda-slo

# 3) ML
# ML autoscaler aktif edilecek
k6 run common-load-test.js

# Veri Toplama
mkdir -p data/raw
python3 export_metrics.py --duration 720 --interval 5 --output data/raw/hpa_run_1.csv

# Veri Ön İşleme
mkdir -p data/processed

python3 preprocess_split.py \
  --input data/raw/hpa_run_1.csv \
  --train-output data/processed/train.csv \
  --test-output data/processed/test.csv

# Gerekli Kütüphanelerin Kurulumu
pip install pandas scikit-learn requests
pip install pandas scikit-learn joblib

# Model eğitimi ve değerlendirmesi
python3 train_model.py \
  --train data/processed/train.csv \
  --test data/processed/test.csv \
  --model-output models/best_model.joblib \
  --results-output data/processed/model_results.csv

# Model Tahminleri
python3 predict_pods.py \
  --rps 120 \
  --p95-latency 0.45 \
  --error-rate 0.02 \
  --cpu-mcores 1500 \
  --in-progress-requests 25

# Canlı Tahminler
python3 predict_live.py \
  --prom-url http://localhost:9090 \
  --model models/best_model.joblib