apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: autoscale-test-service-keda-inprogress
  namespace: default
spec:
  scaleTargetRef:
    name: autoscale-test-service

  minReplicaCount: 1
  maxReplicaCount: 60
  pollingInterval: 5
  cooldownPeriod: 60
  advanced:
      horizontalPodAutoscalerConfig:
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            selectPolicy: Max
            policies:
              - type: Percent
                value: 100
                periodSeconds: 15
              - type: Pods
                value: 2
                periodSeconds: 15
          scaleDown:
            stabilizationWindowSeconds: 60
            selectPolicy: Max
            policies:
              - type: Percent
                value: 50
                periodSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        metricName: ats_in_progress_requests
        query: |
          sum(http_requests_in_progress{exported_endpoint!="/metrics", exported_endpoint!="/health"})
        threshold: "1.5"