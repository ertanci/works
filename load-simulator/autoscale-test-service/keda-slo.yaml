apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: autoscale-test-service-keda-inprogress
  namespace: default
spec:
  scaleTargetRef:
    name: autoscale-test-service

  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 60

  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        metricName: ats_in_progress_requests
        query: |
          sum(http_requests_in_progress{endpoint!="/metrics", endpoint!="/health"})
        threshold: "20"